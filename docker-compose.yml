name: sweety

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Local development credentials; match the URLs in .env.example.
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety-local
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sweety", "-d", "sweety"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
